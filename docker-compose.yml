services:
  postgres:
    image: postgres:16-alpine
    container_name: test-hook-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_hook
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_hook" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
